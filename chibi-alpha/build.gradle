plugins { id 'java'; id 'eclipse'; id 'idea'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = '0.2.0-alpha.1'
group = 'com.prodigytown.chibi'
base { archivesName = 'Prodigy-Chibi-Forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
  mappings channel: 'official', version: '1.20.1'
  runs { configureEach { workingDirectory project.file('run'); property 'forge.logging.console.level','info'; mods { prodigychibi { source sourceSets.main } } }; client {}; server {} }
}
repositories { maven { name='GeckoLib'; url='https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }; mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'; implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
