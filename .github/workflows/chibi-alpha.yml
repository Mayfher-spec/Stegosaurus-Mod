name: Build Prodigy Chibi Alpha
on:
  push:
    branches: ['alpha/chibi-0.1']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Generar geometría y textura del chibi
        run: python3 chibi-alpha/generate_assets.py
      - name: Build mod
        run: gradle --no-daemon -p chibi-alpha build
      - uses: actions/upload-artifact@v4
        with:
          name: Prodigy-Chibi-Alpha-Forge-1.20.1
          path: chibi-alpha/build/libs/*.jar
          if-no-files-found: error
