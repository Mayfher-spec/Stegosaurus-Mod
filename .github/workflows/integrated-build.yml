name: Build The Stegosaurus Mod

on:
  push:
    branches: [feature/prodigy-creatures-v4.3.0-unified, feature/prodigy-creatures-v4.4.0-talents]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compile native adults AND source chibis in a single Forge mod
        run: gradle --no-daemon build

      - name: Fetch pinned Chibi Alpha 0.5.2 resources
        run: |
          git fetch origin refs/heads/alpha/chibi-0.5.2-walk-fix:refs/remotes/origin/alpha/chibi-0.5.2-walk-fix
          git show origin/alpha/chibi-0.5.2-walk-fix:releases/chibi-alpha-0.5.2/Prodigy_Chibi_Alpha_0.5.2_Caminata_Sin_Patinaje_Forge_1.20.1.jar > /tmp/prodigy_chibi_052.jar
          echo '0c46b3f86fde5c7226d387b7a704a4063de71ffce9e0d0f9e9a5ce30b2a8eadd  /tmp/prodigy_chibi_052.jar' | sha256sum -c -

      - name: Restore 0.5.4 UV-corrected eyes
        run: |
          python3 -m pip install pillow
          python3 scripts/patch_chibi_eyes.py /tmp/prodigy_chibi_052.jar /tmp/prodigy_chibi_054.jar

      - name: Bundle ONLY chibi assets, preserving ONE Forge mod identity
        run: |
          mkdir -p dist
          ADULT_JAR="$(find build/libs -maxdepth 1 -name 'The-Stegosaurus-Mod-*.jar' | head -n 1)"
          test -n "$ADULT_JAR"
          python3 scripts/merge_mods.py "$ADULT_JAR" /tmp/prodigy_chibi_054.jar dist/The_Stegosaurus_Mod_v1.0.23_Forge_1.20.1.jar

      - name: Verify single mod descriptor, legacy baby entity, new spawn egg and textures
        run: |
          unzip -p dist/The_Stegosaurus_Mod_v1.0.23_Forge_1.20.1.jar META-INF/mods.toml
          jar tf dist/The_Stegosaurus_Mod_v1.0.23_Forge_1.20.1.jar | grep 'com/prodigytown/chibi/ChibiStego.class'
          jar tf dist/The_Stegosaurus_Mod_v1.0.23_Forge_1.20.1.jar | grep 'com/prodigytown/creatures/ProdigyStegosaurusEgg.class'

      - uses: actions/upload-artifact@v4
        with:
          name: The-Stegosaurus-Mod-1.0.23
          path: dist/The_Stegosaurus_Mod_v1.0.23_Forge_1.20.1.jar
          if-no-files-found: error
