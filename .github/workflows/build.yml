name: Build Stegosaurus for ROR
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Generar las cuatro texturas originales
        run: python3 generate_textures.py
      - name: Generar modelo GeckoLib y animaciones
        run: python3 make_gecko_model.py
      - name: Compilar mod
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: Stegosaurus-for-ROR
          path: build/libs/*.jar
          if-no-files-found: error
